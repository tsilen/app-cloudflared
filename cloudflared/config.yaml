---
name: Cloudflared (hardened)
version: 7.0.17-ts1
slug: cloudflared
description: >-
  Hardened, locally built Cloudflare Tunnel (token mode) to reach
  Home Assistant without opening any ports
url: "https://github.com/tsilen/app-cloudflared"
startup: services
init: false
arch:
  - aarch64
  - amd64
options:
  tunnel_token: null
schema:
  tunnel_token: password
  post_quantum: bool?
  run_parameters:
    - match(^(--(edge-bind-address|edge-ip-version|grace-period|ha-connections|protocol|region|retries|tag)=\S+|--loglevel=(info|warn|error|fatal))$)?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
