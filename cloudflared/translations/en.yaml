---
configuration:
  tunnel_token:
    name: Cloudflare Tunnel Token
    description: >-
      Token of a remote-managed tunnel created in the Cloudflare Zero Trust
      dashboard (Networks > Tunnels). Paste only the token, not the whole
      install command. Hostname routes are configured in the dashboard.
  post_quantum:
    name: Use Post-Quantum Cryptography
    description: >-
      Check to make the tunnel use Post-Quantum Cryptography. Warning: This
      also restricts the tunnel to QUIC, which might lead to problems
      for some users.
  run_parameters:
    name: Additional run parameters
    description: >-
      Optional cloudflared parameters from a fixed allow-list, for example
      --protocol=http2 or --loglevel=warn. Debug logging is not allowed
      because it would log request headers including access tokens.
  log_level:
    name: Log Level
    description: >-
      Log level of the app's own start-up script (not of cloudflared).
