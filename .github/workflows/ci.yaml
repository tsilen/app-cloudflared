---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and shell tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          shellcheck -s bash cloudflared/rootfs/run.sh cloudflared/tests/*.sh
          shellcheck -s sh cloudflared/rootfs/build.sh
      - name: YAMLLint
        run: yamllint --strict .
      - name: Shell tests
        run: bash ./cloudflared/tests/test_run.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (verifies the cloudflared SHA256)
        run: |
          docker build \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION=ci \
            --tag cloudflared-ci:${{ matrix.arch }} \
            cloudflared
      - name: Smoke test
        run: docker run --rm --entrypoint /usr/bin/cloudflared cloudflared-ci:${{ matrix.arch }} --version
